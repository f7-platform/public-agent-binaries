# DEPLOYED COPY — canonical: fseven-platform/.github/issue-label-gate/ plus fseven-platform/labels.json. Do not edit here; change the canonical and run fseven-platform/scripts/deploy-issue-label-gate.sh.
#
# Issue label gate: enforces the canonical label contract (fseven-platform/labels.json,
# rules in fseven-platform/.claude/ISSUE-LABELS.md) on every issue in this repository.
#
# On every issue open, edit, label, unlabel, reopen or transfer it:
#   1. rewrites legacy aliases (bug -> type:bug, P0 -> priority:critical, ...);
#   2. reads the issue-form dropdowns (Priority, Complexity, Code owner) into labels;
#   3. derives priority and type for audit:run-N issues from their severity, and
#      holds an issue whose TITLE reads `[Audit Run N]` but which carries no
#      audit:run-N label, naming the label it lacks rather than adding it
#      (fseven-platform#100 — that label is what audit-evidence-gate.yml keys
#      every closure control on, so an issue without it can be closed with no
#      evidence and nothing reopens it);
#   4. defaults scope:<this repo> when no scope label is present;
#   5. adds status:triage when no status label is present;
#   6. demotes status:ready-for-agent back to status:triage when any routing
#      dimension (type, priority, complexity, scope) is missing or doubled, so an
#      agent worklist can never pick up an unrouted issue;
#   7. treats more than one status label as a routing fault and repairs it to the
#      winner: the gate-owned status:needs-reaudit wins over any other status, and
#      any other status wins over status:ready-for-agent; two statuses with no
#      winner (status:blocked beside status:icebox, say) are held and named;
#   8. derives the `wave` label from the status: an open issue whose one status is
#      status:ready-for-agent after steps 6 and 7 carries `wave`, and any other open
#      issue does not, so promotion is placement on the relay wave board
#      (fseven-platform#195);
#   9. maintains ONE bot comment (marker <!-- issue-label-gate -->) listing what is
#      still missing, and marks it resolved when the issue becomes fully routed.
# It never deletes labels it does not own and never closes or reopens anything.
#
# The same steps run daily over EVERY open issue (the schedule below, or a manual
# workflow_dispatch). An issue filed before this workflow reached the default
# branch, or one whose `issues: opened` run was dropped, never fires a creation
# event and would otherwise sit outside the contract forever: the sweep is the
# backstop that finds it. In sweep mode the gate reads an issue's comments only
# when it has something to say about that issue, which keeps a repository with
# hundreds of open issues inside the GITHUB_TOKEN hourly request budget.
# Note that GitHub suspends `schedule` in a repository with no activity for 60
# days; `deploy-issue-label-gate.sh --check` does not detect that, and a manual
# workflow_dispatch re-arms it.
name: issue-label-gate

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, transferred]
  schedule:
    # Daily, well off the hour so the fleet's repositories do not all sweep at once.
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-label-gate-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  gate:
    # Skip the events this workflow's own label writes produce, except the
    # evidence gate's status:needs-reaudit, which must be reconciled at once.
    # A schedule or a dispatch has no sender and is never skipped.
    if: >-
      github.event_name != 'issues' ||
      github.event.sender.login != 'github-actions[bot]' ||
      (github.event.action == 'labeled' && github.event.label.name == 'status:needs-reaudit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const CONTRACT = {"dimensions":{"type":{"prefix":"type:","labels":[{"name":"type:bug"},{"name":"type:enhancement"},{"name":"type:task"},{"name":"type:docs"},{"name":"type:epic"},{"name":"type:research"},{"name":"type:residuals"}],"extra_labels":[]},"priority":{"prefix":"priority:","labels":[{"name":"priority:critical"},{"name":"priority:high"},{"name":"priority:medium"},{"name":"priority:low"}],"extra_labels":[]},"complexity":{"prefix":"complexity:","labels":[{"name":"complexity:low"},{"name":"complexity:medium"},{"name":"complexity:high"}],"extra_labels":[]},"scope":{"prefix":"scope:","labels":[],"extra_labels":[{"name":"scope:fseven-atlas"}]},"status":{"prefix":"status:","labels":[{"name":"status:triage"},{"name":"status:needs-info"},{"name":"status:needs-decision"},{"name":"status:ready-for-agent"},{"name":"status:blocked"},{"name":"status:needs-reaudit"},{"name":"status:icebox"},{"name":"status:tracking"}],"extra_labels":[]}},"aliases":{"map":{"bug":"type:bug","enhancement":"type:enhancement","documentation":"type:docs","P0":"priority:critical","P1":"priority:high","P2":"priority:medium","severity:critical":"priority:critical","severity:high":"priority:high","severity:medium":"priority:medium","severity:low":"priority:low","icebox":"status:icebox","blocked":"status:blocked","decision-needed":"status:needs-decision"}},"audit":{"run_label_pattern":"^audit:run-[0-9]+$","severity_to_priority":{"audit:severity-critical":"priority:critical","audit:severity-high":"priority:high","audit:severity-medium":"priority:medium","audit:severity-low":"priority:low","audit:severity-info":"priority:low"}}};
            const MARKER = '<!-- issue-label-gate -->';
            const { owner, repo } = context.repo;
            // One event carries one issue; a schedule or a dispatch sweeps every open one.
            const SWEEP = context.eventName !== 'issues';

            const dims = CONTRACT.dimensions;
            const dimNames = ['type', 'priority', 'complexity', 'scope', 'status'];
            const prefixOf = d => dims[d].prefix;
            const known = new Set();
            for (const d of dimNames) for (const l of (dims[d].labels || [])) known.add(l.name);
            for (const l of (dims.scope.extra_labels || [])) known.add(l.name);
            // scope labels are derived from the repository list; accept any scope:* that exists in this repo.
            // Read once: in sweep mode this list is the same for every issue.
            const repoLabels = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map(l => l.name));

            // Apply the contract to one issue. Returns the text it wrote to that issue's
            // comment, or null when it had nothing to say.
            const gateIssue = async issue => {
            const number = issue.number;
            const body = issue.body || '';
            const have = new Set(issue.labels.map(l => typeof l === 'string' ? l : l.name));
            const add = new Set();
            const remove = new Set();
            const problems = [];
            const actions = [];

            const effective = () => new Set([...have, ...add].filter(l => !remove.has(l)));
            const inDim = (d, set) => [...set].filter(l => l.startsWith(prefixOf(d)));

            // 1. Aliases.
            for (const [alias, target] of Object.entries(CONTRACT.aliases.map)) {
              if (have.has(alias)) {
                remove.add(alias); add.add(target);
                actions.push(`rewrote \`${alias}\` to \`${target}\``);
              }
            }

            // 2. Issue-form dropdowns. A form renders "### Heading\n\nvalue"; the value's first
            //    token is the key ("high — needed for MVP" -> high). Only fills an empty dimension.
            const formValue = heading => {
              const m = body.match(new RegExp('###\\s+' + heading + '\\s*\\n+\\s*([^\\n]+)', 'i'));
              if (!m) return null;
              const v = m[1].trim();
              if (!v || /^_no response_$/i.test(v) || /^none$/i.test(v)) return null;
              // Split on whitespace or the em dash only: repository names contain hyphens.
              return v.split(/\s+|—/)[0].toLowerCase();
            };
            const formFill = (dim, heading, mapper) => {
              if (inDim(dim, effective()).length > 0) return;
              const key = formValue(heading);
              if (!key) return;
              const label = mapper(key);
              if (label && (known.has(label) || repoLabels.has(label))) {
                add.add(label); actions.push(`set \`${label}\` from the form's ${heading} field`);
              }
            };
            formFill('priority', 'Priority', k => `priority:${k}`);
            formFill('complexity', 'Complexity', k => `complexity:${k}`);
            formFill('scope', 'Code owner', k => `scope:${k}`);
            formFill('type', 'Type', k => `type:${k}`);

            // 3. Audit issues: type and priority follow the finding.
            const runRe = new RegExp(CONTRACT.audit.run_label_pattern);
            const isAudit = [...effective()].some(l => runRe.test(l));
            // The run number the TITLE claims, if this is a mint-contract audit title
            // (`[Audit Run N][Sprint S.A] ...`). Read here, beside isAudit, because this
            // is where the run label is interpreted; acted on at 6. below, where the
            // routing verdict lives.
            const titleRun = (issue.title || '').match(/^\[Audit Run (\d+)\]/);
            const missingRunLabel = titleRun && !isAudit ? `audit:run-${titleRun[1]}` : null;
            if (isAudit) {
              if (inDim('type', effective()).length === 0) { add.add('type:task'); actions.push('set `type:task` (audit remediation)'); }
              if (inDim('priority', effective()).length === 0) {
                for (const [sev, pri] of Object.entries(CONTRACT.audit.severity_to_priority)) {
                  if (effective().has(sev)) { add.add(pri); actions.push(`set \`${pri}\` from \`${sev}\``); break; }
                }
              }
            }

            // 4. Scope defaults to the filing repository.
            if (inDim('scope', effective()).length === 0) {
              const s = `scope:${repo}`;
              if (repoLabels.has(s)) { add.add(s); actions.push(`set \`${s}\` (filing repository)`); }
              else problems.push(`no \`scope:\` label exists for this repository; run \`scripts/sync-labels.sh\` in fseven-platform`);
            }

            // 5. Status defaults to triage.
            if (inDim('status', effective()).length === 0) {
              add.add('status:triage'); actions.push('set `status:triage` (no status was present)');
            }

            // 6./7. Exactly-one rules and the routing gate.
            let routed = true;
            for (const d of ['type', 'priority', 'complexity', 'scope']) {
              const got = inDim(d, effective());
              if (got.length === 0) { routed = false; problems.push(`missing \`${prefixOf(d)}*\` (exactly one required)`); }
              else if (got.length > 1) { routed = false; problems.push(`more than one \`${prefixOf(d)}*\`: ${got.map(x => '`' + x + '`').join(', ')} (keep exactly one)`); }
            }
            // fseven-platform#100: an audit remediation title carrying no audit:run-N
            // label. `audit-evidence-gate.yml` gates its whole enforce-close job on
            // `audit:run-` and its script returns when no label matches the pattern, and
            // the verifier-approval job returns the same way, so an issue minted without
            // the label is invisible to every closure-quality control while looking
            // identical to a governed issue: it can be closed with no evidence and
            // nothing reopens it. Measured on 2026-09-11: 65 closed issues across nine
            // repositories, all from runs 28 to 31.
            //
            // The gate NAMES the label and holds the issue; it does not add it. That is
            // deliberate and is narrower than 3. above, which fills type and priority
            // only for an issue that ALREADY carries a run label — there the label is
            // the gate's evidence that this is an audit issue. A label invented from a
            // title would be the gate manufacturing its own evidence, and it would enrol
            // in the evidence gate's reopen-on-close enforcement an issue nobody minted.
            // The run labels are also the one family labels.json deliberately does not
            // enumerate, so sync-labels.sh never creates them and only a /plan pass does.
            if (missingRunLabel) {
              routed = false;
              problems.push(`the title reads \`[Audit Run ${titleRun[1]}]\` but no \`audit:run-*\` label is present: add \`${missingRunLabel}\`. Without it this issue is invisible to \`audit-evidence-gate.yml\`, which keys every closure control on that label, so it could be closed with no evidence and nothing would reopen it`);
            }
            // More than one status label breaks the contract (labels.json makes the
            // status dimension exactly_one) and is repaired to the winner. Rule 5 of
            // ISSUE-LABELS.md makes the gate-owned status:needs-reaudit win over any
            // other status; the audit evidence gate reopened issues with it beside
            // status:triage until fseven-platform#195, and its label writes start no
            // run of this workflow, so the sweep is what repairs one written before.
            // status:ready-for-agent loses to any other status, because rule 2 makes
            // promotion a deliberate act and an issue also marked blocked, icebox or
            // triage has not cleanly had it. The contract names no winner between
            // two other statuses, so the gate does not invent one: it holds the
            // issue as unrouted and names both labels for a person to settle.
            let statuses = inDim('status', effective());
            if (statuses.length > 1) {
              if (statuses.includes('status:needs-reaudit')) {
                for (const s of statuses) if (s !== 'status:needs-reaudit') remove.add(s);
                actions.push(`kept gate-owned \`status:needs-reaudit\` and removed ${statuses.filter(s => s !== 'status:needs-reaudit').map(x => '`' + x + '`').join(', ')}: an issue carries exactly one status, and \`status:needs-reaudit\` wins over any other`);
              } else if (statuses.includes('status:ready-for-agent')) {
                remove.add('status:ready-for-agent');
                actions.push(`removed \`status:ready-for-agent\`, which loses to ${statuses.filter(s => s !== 'status:ready-for-agent').map(x => '`' + x + '`').join(', ')}: an issue carries exactly one status, and one also marked otherwise has not cleanly been promoted`);
              }
              statuses = inDim('status', effective());
              if (statuses.length > 1) {
                routed = false;
                problems.push(`more than one \`status:*\`: ${statuses.map(x => '`' + x + '`').join(', ')} (keep exactly one; the contract names no winner between these)`);
              }
            }
            statuses = inDim('status', effective());
            if (!routed && statuses.includes('status:ready-for-agent')) {
              remove.add('status:ready-for-agent'); add.add('status:triage');
              actions.push('demoted `status:ready-for-agent` to `status:triage`: an agent worklist may not pick up an unrouted issue');
            }

            // 8. `wave` follows status:ready-for-agent (fseven-platform#195, Ian's board
            //    ruling of 2026-09-14). The relay bus offers only items carrying `wave`,
            //    and promotion is the maintainer's act, so promotion itself is what puts
            //    an item on the board and any other status takes it off. Read after 6./7.,
            //    so an unrouted issue the gate just demoted, and one the evidence gate
            //    marked for re-audit, lose `wave` on the same run. Two status labels at
            //    once is not a clean promotion and does not keep an item on the board.
            //    A closed issue is left as it is: the workflow does not listen to
            //    `closed`, the sweep reads open issues only, and the bus ignores closed
            //    items. A `source:rewind` issue gets no exception here; the bus refuses
            //    one carrying `wave` without a recorded review (fseven-relay#610).
            if (issue.state !== 'closed') {
              const finalStatuses = inDim('status', effective());
              const ready = routed && finalStatuses.length === 1 && finalStatuses[0] === 'status:ready-for-agent';
              if (ready && !effective().has('wave')) {
                if (repoLabels.has('wave')) { add.add('wave'); actions.push('set `wave` because the status is `status:ready-for-agent`: the gate derives `wave` from that status, so promotion places the issue on the relay wave board'); }
                else problems.push('the status is `status:ready-for-agent` but no `wave` label exists for this repository, so the gate cannot place it on the relay wave board; run `scripts/sync-labels.sh` in fseven-platform');
              } else if (!ready && effective().has('wave')) {
                remove.add('wave');
                actions.push('removed `wave` because the status is not `status:ready-for-agent`: the gate derives `wave` from that status, so an issue that is not ready leaves the relay wave board');
              }
            }

            // Apply.
            const toAdd = [...add].filter(l => !have.has(l));
            const toRemove = [...remove].filter(l => have.has(l));
            for (const l of toRemove) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: l }); } catch (e) { if (e.status !== 404) throw e; }
            }
            if (toAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: toAdd });
            }

            // 9. One comment, updated in place. A sweep over hundreds of issues reads the
            //    comment list only for an issue it has something to say about; on an issue
            //    event it reads them anyway, so a now-complete issue's comment is resolved.
            if (SWEEP && !problems.length && !actions.length) return null;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const mine = comments.find(c => c.user && c.user.type === 'Bot' && (c.body || '').includes(MARKER));
            const lines = [MARKER, '**Issue label gate**', ''];
            if (problems.length) {
              lines.push('This issue is not fully routed. Until every line below is fixed it stays in `status:triage` and no agent worklist or lane may take it.', '');
              for (const p of problems) lines.push(`- ${p}`);
              lines.push('', 'Rules: `fseven-platform/.claude/ISSUE-LABELS.md`. Set the labels, or edit the form fields above, and the gate re-checks on save.');
            } else {
              lines.push('Routing labels are complete: one each of `type:`, `priority:`, `complexity:`, `scope:`, `status:`.');
            }
            if (actions.length) { lines.push('', 'Changes made by the gate on this run:'); for (const a of actions) lines.push(`- ${a}`); }
            if (SWEEP) { lines.push('', '_Found by the daily sweep, not by this issue\'s creation or edit event._'); }
            const text = lines.join('\n');
            if (problems.length || actions.length) {
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
              else await github.rest.issues.createComment({ owner, repo, issue_number: number, body: text });
            } else if (mine && !(mine.body || '').includes('Routing labels are complete')) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text });
            }
            return text;
            };

            // Targets: the event's issue, or every open issue when sweeping.
            let targets;
            if (SWEEP) {
              targets = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            } else {
              // Fresh read: the payload's label list can be stale when events race.
              targets = [(await github.rest.issues.get({ owner, repo, issue_number: context.payload.issue.number })).data];
            }
            targets = targets.filter(i => !i.pull_request);

            const summary = core.summary;
            let touched = 0;
            for (const issue of targets) {
              const text = await gateIssue(issue);
              if (text === null) continue;
              touched += 1;
              summary.addHeading(`#${issue.number}`, 3).addRaw(text);
            }
            if (SWEEP) {
              summary.addHeading(`Sweep: ${touched} of ${targets.length} open issues needed the gate`, 2);
            }
            await summary.write();

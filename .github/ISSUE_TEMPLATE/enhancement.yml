# DEPLOYED COPY — canonical: fseven-platform/.github/issue-label-gate/ plus fseven-platform/labels.json. Do not edit here; change the canonical and run fseven-platform/scripts/deploy-issue-label-gate.sh.
name: Enhancement
description: A new capability or an improvement to an existing one.
title: "<surface>: <what changes, in one line>"
labels: ["type:enhancement", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Every issue carries exactly one `type:`, `priority:`, `complexity:`, `scope:` and `status:` label. This form sets type and status; pick priority, complexity and code owner below and the label gate applies them. Rules: `fseven-platform/.claude/ISSUE-LABELS.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. What changes, for whom.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The user pain, business value or debt this removes. Name the ADR or epic it belongs to if there is one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The checkable conditions under which this is done. An issue without them cannot be promoted to `status:ready-for-agent`.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How soon this is worked relative to everything else.
      options:
        - "critical — blocks the MVP production path, exploitable security flaw, or data loss"
        - "high — needed for MVP production or a live UAT path; a flake in a required check"
        - "medium — planned work that improves the product; no date pressure"
        - "low — polish, tech debt without risk, nice-to-have"
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: How hard for one dispatched agent. high routes to the top model; be conservative.
      options:
        - "low — one repo, one surface, known fix shape, no design decision"
        - "medium — several files or one crate/app, tests to write, fix shape to discover"
        - "high — crosses repos or contracts, needs an ADR or ruling, trust plane, migration, or unknown blast radius"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Code owner
      description: The repository where the change lands. Cross-repo work is split into one issue per repo.
      options:
        - "public-agent-binaries — this repository"
        - "fseven-agent"
        - "fseven-atlas-mvp"
        - "fseven-backbone"
        - "fseven-controller"
        - "fseven-docs"
        - "fseven-identity-providers"
        - "fseven-platform"
        - "fseven-relay"
        - "fseven-schemas"
        - "public-atlas-binaries"
        - "public-docs"
      default: 0
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Affected files
      description: Paths you already know are involved.

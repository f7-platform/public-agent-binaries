# DEPLOYED COPY — canonical: fseven-platform/.github/issue-label-gate/ plus fseven-platform/labels.json. Do not edit here; change the canonical and run fseven-platform/scripts/deploy-issue-label-gate.sh.
name: Task
description: Chore, refactor, hardening, ops or docs work with no user-visible feature.
title: "<surface>: <what is done, in one line>"
labels: ["type:task", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Every issue carries exactly one `type:`, `priority:`, `complexity:`, `scope:` and `status:` label. This form sets type and status; pick priority, complexity and code owner below and the label gate applies them. For documentation-only work change the type to `type:docs` after filing. Rules: `fseven-platform/.claude/ISSUE-LABELS.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What needs to be done and why. Cite the audit finding, ADR or PR that raised it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The checkable conditions under which this is done. An issue without them cannot be promoted to `status:ready-for-agent`.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "critical — blocks the MVP production path, exploitable security flaw, or data loss"
        - "high — needed for MVP production or a live UAT path; a flake in a required check"
        - "medium — planned work that improves the product; no date pressure"
        - "low — polish, tech debt without risk, nice-to-have"
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: How hard for one dispatched agent. high routes to the top model; be conservative.
      options:
        - "low — one repo, one surface, known fix shape, no design decision"
        - "medium — several files or one crate/app, tests to write, fix shape to discover"
        - "high — crosses repos or contracts, needs an ADR or ruling, trust plane, migration, or unknown blast radius"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Code owner
      description: The repository where the change lands.
      options:
        - "public-agent-binaries — this repository"
        - "fseven-agent"
        - "fseven-atlas-mvp"
        - "fseven-backbone"
        - "fseven-controller"
        - "fseven-docs"
        - "fseven-identity-providers"
        - "fseven-platform"
        - "fseven-relay"
        - "fseven-schemas"
        - "public-atlas-binaries"
        - "public-docs"
      default: 0
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Affected files
